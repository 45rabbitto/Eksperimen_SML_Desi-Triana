name: Data Preprocessing Pipeline

on:
  # Trigger saat push ke branch main/master
  push:
    branches: [ main, master ]
    paths:
      - 'dataset_raw/**'
      - 'preprocessing/**'
  
  # Trigger manual via GitHub UI
  workflow_dispatch:
  
  # Trigger terjadwal setiap hari jam 00:00
  schedule:
    - cron: '0 0 * * *'

jobs:
  preprocess-data:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4
    
    # Step 2: Setup Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn matplotlib seaborn openpyxl
    
    # Step 4: Run preprocessing script
    - name: Run preprocessing
      run: |
        python preprocessing/automate_Budi.py
    
    # Step 5: Upload preprocessing result as artifact
    - name: Upload processed dataset
      uses: actions/upload-artifact@v4
      with:
        name: processed-dataset
        path: preprocessing/dataset_preprocessing/
        retention-days: 30
    
    # Step 6: Commit and push processed data
    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add preprocessing/dataset_preprocessing/
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: preprocessing completed $(date '+%Y-%m-%d %H:%M:%S')"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
