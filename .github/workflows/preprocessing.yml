name: Diamond Data Preprocessing

on:
  push:
    paths:
      - 'data_raw/diamonds.csv'
      - 'preprocessing/automate_Desi-Triana.py'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'
    
permissions:
  contents: write
  
jobs:
  preprocess-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn
    
    - name: Run preprocessing script
      run: |
        python preprocessing/automate_Desi-Triana.py
    
    - name: Check if cleaned data generated
      run: |
        if [ -f "preprocessing/data_preprocessed/diamonds_clean.csv" ]; then
          echo " Preprocessing berhasil! Dataset bersih ditemukan."
          ls -lh preprocessing/data_preprocessed/
        else
          echo " Gagal: Dataset bersih tidak ditemukan!"
          exit 1
        fi
    
    - name: Upload cleaned dataset as artifact
      uses: actions/upload-artifact@v4
      with:
        name: diamonds_clean_dataset
        path: preprocessing/data_preprocessed/diamonds_clean.csv
        retention-days: 30
    
    - name: Commit and push cleaned dataset
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add preprocessing/data_preprocessed/diamonds_clean.csv
        git diff --staged --quiet || git commit -m "Auto-update: Diamond clean dataset [skip ci]"
        git push
